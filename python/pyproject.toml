[project]
name = "waragents"
version = "0.1.0"
description = "A turn-based multi-agent simulation where you program agents with decision trees"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["waragents*"]

[tool.setuptools.package-data]
"waragents.web" = ["static/*", "static/js/*", "static/js/screens/*"]
"waragents.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
